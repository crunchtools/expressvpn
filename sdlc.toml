[tool.sdlc]
repo-kinds = ["container-image"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/expressvpn"
# The VPN cannot connect in CI, so the old outside-driver gate (podman from the
# host, not enforced by sdlc) is now the boot-gate check below, run inside the
# image the PR builds.
boot = "none"
boot-none-reason = "a VPN cannot connect in CI (no activation code, TUN or NET_ADMIN); the expressvpn-image and boot-gate checks in [tool.sdlc.ci] run the image's assertions"

[tool.sdlc.ci]
checks = ["expressvpn-image", "boot-gate"]

[tool.sdlc.ci.expressvpn-image]
kind = "image-build"

# Entrypoint parses and fails closed without CODE; every VPN binary and
# tinyproxy is present with no unresolved library. argv[0] replaces the image's
# entrypoint.
[tool.sdlc.ci.boot-gate]
kind = "command"
image = "localhost/expressvpn:sdlc"
argv = ["bash", "tests/image/boot-check.sh"]
