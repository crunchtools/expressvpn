[tool.sdlc]
repo-kinds = ["container-image"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/expressvpn"
# iptables-nft is RHEL AppStream, outside UBI and EPEL; the build registers.
rhsm = true
# The VPN cannot connect in CI. tests/image/boot-check.sh runs inside the build
# as its last step, so the image job's build is the boot gate.
boot = "none"
boot-none-reason = "a VPN cannot connect in CI (no activation code, TUN or NET_ADMIN); the Containerfile runs tests/image/boot-check.sh as its last build step"

[tool.sdlc.ci]
# The Containerfile needs RHSM build secrets that `sdlc ci` is not given. The
# image job builds, smoke-tests and scans it, with them.
skip = ["container-build", "container-smoke", "container-scan"]
